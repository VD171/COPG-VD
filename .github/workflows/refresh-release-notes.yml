# ======================================================================
#
#  Regenerate the lean body for an ALREADY published release and apply it as
#  github-actions[bot], WITHOUT rebuilding. A local `gh release edit` uses a
#  human PAT and re-attributes the release, breaking auditability
#  (github_release_sempre_bot_author); from CI the bot stays the author. The
#  body is the version's CHANGELOG section plus the @Priv8_VD banner (owner
#  28/11); any older checksums asset is removed.
name: Refresh release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to refresh, e.g. v6.19-vd"
        required: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate notes for ${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          set -e
          gh release view "$VER" >/dev/null 2>&1 || { echo "::error::release $VER not found"; exit 1; }
          notes=$(awk -v v="## $VER" '$0 ~ "^"v { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="See the commit history for the changes in this version."
          fi
          {
            printf '%s\n' "$notes"
            printf '\n---\n'
            printf '%s\n' "📣 **Join the channel for updates:** @Priv8_VD https://t.me/Priv8_VD"
          } > release-notes.md
          gh release edit "$VER" --notes-file release-notes.md
          # Drop a checksums asset an older release shipped (releases carry only the .zip now;
          # the per-file .sha256 inside the zip is the integrity gate).
          gh release delete-asset "$VER" SHA256SUMS.txt -y || true

      - name: Assert the release is still authored by github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          author="$(gh release view "$VER" --json author -q '.author.login')"
          if [ "$author" != "github-actions[bot]" ]; then
            echo "::error::Release $VER is authored by '$author', not github-actions[bot] - auditability rule violated."
            exit 1
          fi
