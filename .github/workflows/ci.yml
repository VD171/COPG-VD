name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S error -s sh module/*.sh module/vdlu/update.sh module/vdlu/vdlu-verify
          shellcheck -S error .github/scripts/*.sh

      - name: Validate JSON
        run: |
          for f in module/update.json module/webroot/config.json module/webroot/lang/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "ok $f"
          done

      - name: JS syntax check
        run: |
          for f in module/webroot/scripts.js module/webroot/i18n.js module/webroot/lang/en.js; do
            node --check "$f" && echo "ok $f"
          done

      - name: Kit guards (release-workflow-lint)
        run: |
          # Self-contained release-model lint - gates HERE (checks only this repo's workflows).
          # vendor-parity (vs the private kit) and engine-parity (vs VDLiveUpdate) compare against
          # separate canonical repos not fetched in CI, so they are enforced in the local pre-push
          # ritual, not here (no CI secret for the private kit, by design).
          sh .github/scripts/release-workflow-lint.sh .
          echo "vendor-parity + engine-parity: enforced in the local pre-push ritual"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Build scope-helper dex (sanity)
        run: bash dex/build.sh

      - name: Assemble module zip (sanity)
        run: |
          cd module && zip -r9 ../COPG-VD-ci.zip . -x '.git*' -x 'vdlu/RELEASE.md' -x 'bin/*/.gitkeep'

      - uses: actions/upload-artifact@v7
        with:
          name: COPG-VD-ci
          path: COPG-VD-ci.zip
