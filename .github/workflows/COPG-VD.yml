name: COPG-VD

# The version lives in module/module.prop and nowhere else. .github/scripts/version.sh
# bumps it, derives versionCode and rewrites module/update.json, so no string is ever
# typed into this file.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'version bump'
        type: choice
        options: [none, patch, minor, major]
        default: none
      release:
        description: 'publish a GitHub release with the zip'
        type: boolean
        default: false
      notes:
        description: 'changelog lines for this version (used by the automatic fingerprint release)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: copg-vd-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: COPG-VD

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          elif [ -d "$ANDROID_HOME/cmdline-tools/tools" ]; then
            mv $ANDROID_HOME/cmdline-tools/tools $ANDROID_HOME/cmdline-tools/latest
          else
            echo "Unexpected directory structure after unzip:"
            ls -la $ANDROID_HOME/cmdline-tools
            exit 1
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.1"
          mkdir -p $ANDROID_HOME/ndk
          wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $ANDROID_HOME/ndk
          NDK_DIR=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d -name "android-ndk-r29*" | head -n 1)
          echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get purge -y man-db 2>/dev/null || true
          sudo rm -rf /var/cache/man /var/lib/man-db /usr/share/man 2>/dev/null || true
          echo 'DPkg::Post-Invoke { ":"; };' | sudo tee /etc/apt/apt.conf.d/99noman >/dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zip curl

      # One .so per ABI, named the way Zygisk loads them: zygisk/<abi>.so.
      # Plain cmake instead of a third-party action: one less thing to trust in a build that
      # produces a library loaded into zygote.
      - name: Build zygisk libraries
        env:
          ABIS: arm64-v8a armeabi-v7a x86 x86_64
        run: |
          for abi in $ABIS; do
            echo "::group::$abi"
            start=$(date -u +%s)
            cmake -S zygisk -B "zygisk/build/$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_MAKE_PROGRAM=/usr/bin/make
            cmake --build "zygisk/build/$abi" --parallel "$(nproc)"
            if [ ! -f "zygisk/build/$abi/libspoof.so" ]; then
              echo "::error::$abi library not built"
              ls -la "zygisk/build/$abi"
              exit 1
            fi
            echo "$abi built in $(( $(date -u +%s) - start ))s: $(stat -c %s "zygisk/build/$abi/libspoof.so") bytes"
            echo "::endgroup::"
          done

      - name: Resolve version
        id: version
        env:
          SUFFIX: -vd   # fork-tag: version.sh round-trips the -vd versionName (versionCode unchanged)
        run: .github/scripts/version.sh "${{ inputs.bump == 'none' && 'read' || inputs.bump }}"

      # The automatic fingerprint release has no hand-written CHANGELOG section, so it brings
      # its own lines: they become the section for this version (kept in the file, committed
      # with the bump) and therefore also the release notes.
      - name: Changelog section from notes
        if: steps.version.outputs.bumped == 'true' && inputs.notes != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          grep -q "^## $VERSION\$" CHANGELOG.md && { echo "section already there"; exit 0; }
          {
            sed -n '1,2p' CHANGELOG.md
            printf '## %s\n%s\n\n' "$VERSION" "$NOTES"
            sed -n '3,$p' CHANGELOG.md
          } > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md
          sed -n '1,8p' CHANGELOG.md

      - name: Prepare module structure
        run: |
          mkdir -p module/zygisk
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "zygisk/build/$abi/libspoof.so" "module/zygisk/$abi.so"
          done
          chmod 755 module/zygisk/*.so

          # The WebUI reads these locally instead of fetching them from GitHub at runtime.
          cp README.md LICENSE module/webroot/

          chmod 755 module/customize.sh module/service.sh module/fingerprint-update.sh module/post-fs-data.sh module/vdlu/update.sh module/vdlu/vdlu-verify module/META-INF/com/google/android/update-binary

          # VDLU bundled tools (openssl/curl/zstd per ABI): ship them executable and
          # refuse to release any ABI that lacks its supply-chain provenance.
          # Regenerate with .github/scripts/build_bin.sh (see module/vdlu/RELEASE.md).
          if [ -d module/bin ]; then
            find module/bin -type f ! -name '.gitkeep' ! -name 'PROVENANCE.json' -exec chmod 755 {} +
            for d in module/bin/*/; do
              [ -f "$d/PROVENANCE.json" ] || { echo "::error::missing provenance: $d"; exit 1; }
            done
          fi

      # Framework scope-helper dex (javac + d8), arch-independent, built fresh so the
      # gitignored binary never drifts from source. Lists every static android:process
      # (the hidden ones dumpsys misses) for the WebUI scope picker. Non-fatal: the
      # WebUI falls back to shell enumeration if the dex is absent.
      - name: Build scope-helper dex
        run: |
          bash dex/build.sh
          [ -f module/etc/copgvd_scope.dex ] || { echo "::error::copgvd_scope.dex not built"; exit 1; }

      # Per-file sha256 companions (STANDARDS 8): a flash-time, human-checkable fail-safe
      # (sha256sum -c) next to every shipped file. Runs on the final tree right before zipping.
      # Build artifact (gitignored, not in the VDLU feed); the signed baseline stays the integrity root.
      # Prune-before-hash (STANDARDS 8): remove everything the zip excludes BEFORE gen-sha256, so no
      # orphan <file>.sha256 ships (a companion whose target is absent ABORTS the on-device flash gate).
      - name: Prune non-shipped files before hashing
        run: rm -f module/bin/*/.gitkeep module/vdlu/RELEASE.md

      - name: Per-file sha256 companions
        run: bash .github/scripts/gen-sha256.sh module/

      - name: Package module
        run: |
          cd module && zip -r9 "../${{ steps.version.outputs.zip_name }}" . -x '.git*' -x 'vdlu/RELEASE.md' -x 'vdlu/RELEASE.md.sha256' -x 'bin/*/.gitkeep'
          cd .. && unzip -l "${{ steps.version.outputs.zip_name }}" | tail -n 1

      # Orphan .sha256 guard (STANDARDS 8): fail the build if the shipped zip carries an orphan
      # <file>.sha256 (companion present, target absent = unflashable), catching a prune/exclude slip.
      - name: Zip orphan .sha256 guard
        run: sh .github/scripts/zip-orphan-check.sh "${{ steps.version.outputs.zip_name }}"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: COPG-VD-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.zip_name }}

      - name: Publish release
        # Do NOT gate on `bumped`: the manual ritual pre-bumps and dispatches bump=none, so
        # bumped is false there yet a publish IS wanted. Instead be idempotent - skip if this
        # version is already released, so a re-dispatch never hard-fails on an existing tag.
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "::notice::release $VERSION already exists; skipping create"; exit 0
          fi
          # Release notes come from this version's section of the CHANGELOG when it has one.
          notes=$(awk -v v="## $VERSION" '
              $0 ~ "^"v { found = 1; next }
              found && /^## / { exit }
              found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
              echo "::warning::no CHANGELOG section for $VERSION"
              notes="See the commit history for the changes in this version."
          fi
          # Every release carries the channel banner (same footer applied by hand to the
          # manual releases), so automatic fingerprint releases get it too.
          # sha256 of the zip and each shipped .so, published so anyone can verify the bytes.
          sha256sum "${{ steps.version.outputs.zip_name }}" > SHA256SUMS.txt
          ( cd module/zygisk && sha256sum *.so ) >> SHA256SUMS.txt
          {
            printf '%s\n' "$notes"
            printf '\n### Checksums (sha256)\n\n'
            printf '```\n'
            cat SHA256SUMS.txt
            printf '```\n'
            printf '\n---\n'
            printf '%s\n' "📣 **Join the channel for updates:** @Priv8_VD https://t.me/Priv8_VD"
          } > release-notes.md
          gh release create "$VERSION" "${{ steps.version.outputs.zip_name }}" SHA256SUMS.txt \
            --title "$VERSION" --notes-file release-notes.md
          # module/update.json already points at this asset, so the in-app updater works
          # the moment the release exists.

      - name: Commit the bump
        # AFTER a successful publish, and only on a real release: record the bump on main. Gated on
        # inputs.release so the auto-fingerprint preview (release=false) never bot-commits a bump;
        # placed after Publish so a failed publish never leaves main bumped with a 404 zipUrl (CI#5).
        if: inputs.release && steps.version.outputs.bumped == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module/module.prop module/update.json CHANGELOG.md
          git commit -m "Release ${{ steps.version.outputs.version }} (versionCode ${{ steps.version.outputs.version_code }})"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### COPG-VD ${{ steps.version.outputs.version }}"
            echo ''
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | ${{ steps.version.outputs.version }} |"
            echo "| versionCode | ${{ steps.version.outputs.version_code }} |"
            echo "| bumped | ${{ steps.version.outputs.bumped }} |"
            echo "| released | ${{ inputs.release }} |"
          } >> "$GITHUB_STEP_SUMMARY"
